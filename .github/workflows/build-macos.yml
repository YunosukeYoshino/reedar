name: Build macOS preview

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target Mac architecture (live validation currently covers arm64)
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - x64

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BUILD_ARCH: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install test cleanup tool
        run: brew install trash
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate
        run: bun run check
      - name: Package preview
        run: |
          case "$BUILD_ARCH" in
            arm64|x64) bun run dist:mac --"$BUILD_ARCH" ;;
            *) echo "Unsupported architecture" >&2; exit 1 ;;
          esac
          bun run checksums
      - name: Upload preview artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Reedar-mac-${{ inputs.architecture }}-preview
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
